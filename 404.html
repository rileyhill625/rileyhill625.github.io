<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — Riley Hill</title>
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css" />
  <style>
    .err { min-height: 82vh; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 1.1rem; }
    .err h1 { font-size: clamp(3rem, 12vw, 7rem); color: var(--maroon-hi); line-height: 1; }
    .err .sub { color: var(--muted); max-width: 44ch; }
  </style>
</head>
<body>
  <main class="err container">
    <p class="mono">Error 404 · Open circuit</p>
    <h1>No path to that page.</h1>
    <p class="sub">The page you're looking for isn't on this feeder — the link may be broken, or the page may have moved.</p>
    <a class="btn btn--primary" href="/index.html">← Back to the main page</a>
  </main>
